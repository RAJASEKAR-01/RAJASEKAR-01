<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Rajasekar M - AI-Integrated Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#1d1d20"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4e4e7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e4e4e7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e4e4e7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="40" y="70" width="0" height="30">
      <animate attributeName="width" values="0.0;9.6;19.2;28.8;38.4;48.0;57.6;67.2;76.8" keyTimes="0.0000;0.1250;0.2500;0.3750;0.5000;0.6250;0.7500;0.8750;1.0000" calcMode="discrete" begin="0.4s" dur="0.9s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="36" y="100" width="0" height="70">
      <animate attributeName="width" from="0" to="560" begin="1.5s" dur="1s" calcMode="spline" keyTimes="0;1" keySplines="0.65 0 0.35 1" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="frame"><rect width="900" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="#0a0a0b"/>
    <rect width="900" height="260" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="16" fill="none" stroke="#202024"/>

  <!-- top row -->
  <text x="40" y="46" font-family="'Courier New', monospace" font-size="13" fill="#4a4a50">~/rajasekar-01</text>
  <g font-family="'Courier New', monospace" font-size="13" fill="#4a4a50">
    <circle cx="742" cy="42" r="3" fill="#a1a1aa">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="46" text-anchor="end">open to work</text>
  </g>

  <!-- line 1: typed command -->
  <g clip-path="url(#c1)">
    <text x="40" y="92" font-family="'Courier New', monospace" font-size="16" fill="#71717a">$ whoami</text>
  </g>

  <!-- line 2: name wipe-in -->
  <g clip-path="url(#c2)">
    <text x="38" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="300" letter-spacing="3" fill="#f4f4f5">Rajasekar M</text>
  </g>

  <!-- line 3: role -->
  <text x="40" y="190" font-family="'Courier New', monospace" font-size="18" fill="#8b8b92" opacity="0">AI-Integrated Full Stack Developer
    <animate attributeName="opacity" from="0" to="1" begin="2.5s" dur="0.8s" fill="freeze"/>
  </text>
  <!-- blinking cursor -->
  <rect x="413.2" y="175" width="9" height="19" fill="#e4e4e7" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- divider: draws in, then a light sweeps along it -->
  <line x1="40" y1="224" x2="860" y2="224" stroke="#2a2a2e" stroke-width="1" stroke-dasharray="820" stroke-dashoffset="820">
    <animate attributeName="stroke-dashoffset" from="820" to="0" begin="2.8s" dur="1.1s" fill="freeze"/>
  </line>
  <rect x="40" y="223" width="110" height="2" fill="url(#scan)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.4s" fill="freeze"/>
    <animate attributeName="x" values="40;750" dur="4.5s" begin="4s" repeatCount="indefinite"/>
  </rect>
</svg>
