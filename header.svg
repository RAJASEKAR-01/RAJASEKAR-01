<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Rajasekar M - AI-Integrated Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rainbow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff0080"/>
      <stop offset="0.17" stop-color="#ff8c00"/>
      <stop offset="0.34" stop-color="#ffe600"/>
      <stop offset="0.5" stop-color="#00ff9d"/>
      <stop offset="0.67" stop-color="#00cfff"/>
      <stop offset="0.84" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff0080"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.5" stop-color="#140b2e"/>
      <stop offset="1" stop-color="#06202b"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="clip"><rect width="900" height="280" rx="22"/></clipPath>
  </defs>

  <style>
    .title { font: 800 70px 'Segoe UI', Arial, sans-serif; letter-spacing: 6px; }
    .sub { font: 600 24px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; opacity: 0; animation: fadeUp 1.2s ease-out 0.6s forwards; }
    .tags { font: 500 17px 'Courier New', monospace; opacity: 0; animation: fadeUp 1.2s ease-out 1.2s forwards; }
    .code { font: 700 46px 'Courier New', monospace; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .f1 { animation: float 4s ease-in-out infinite; }
    .f2 { animation: float 5s ease-in-out infinite .8s; }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- drifting colour blobs -->
    <circle cy="70" r="110" fill="#ff0080" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" values="120;380;120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cy="210" r="120" fill="#00cfff" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" values="780;520;780" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cy="140" r="100" fill="#7a5cff" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" values="450;650;250;450" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- twinkling stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="230" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="3s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="30" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="245" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin=".2s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="28" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin=".9s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="238" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="45" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="215" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="90" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="150" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- floating code symbols -->
    <g class="f1"><text class="code" x="70" y="115" fill="#00cfff">&lt;/&gt;</text></g>
    <g class="f2"><text class="code" x="760" y="200" fill="#ff0080">{ }</text></g>

    <!-- title: glow layer + crisp layer, both with moving rainbow -->
    <text class="title" x="450" y="125" text-anchor="middle" fill="url(#rainbow)" filter="url(#glow)" opacity=".7">RAJASEKAR M</text>
    <text class="title" x="450" y="125" text-anchor="middle" fill="url(#rainbow)">RAJASEKAR M</text>

    <text class="sub" x="450" y="170" text-anchor="middle">AI-Integrated Full Stack Developer</text>

    <text class="tags" x="450" y="212" text-anchor="middle">
      <tspan fill="#61dafb">React</tspan><tspan fill="#8b949e">  •  </tspan><tspan fill="#68d391">Node.js</tspan><tspan fill="#8b949e">  •  </tspan><tspan fill="#4ade80">MongoDB</tspan><tspan fill="#8b949e">  •  </tspan><tspan fill="#c084fc">Gemini AI</tspan>
    </text>

    <!-- animated rainbow bar -->
    <rect x="0" y="272" width="900" height="8" fill="url(#rainbow)"/>
  </g>
</svg>
